name: "Setup Rust and Dependencies"
description: "Sets up Rust, sccache, and native GTK4 dependencies"
inputs:
  toolchain:
    description: "Rust toolchain to install"
    required: false
    default: "stable"
  components:
    description: "Rust components to install"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Setup sccache
      uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable/v1
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
    - name: Install native dependencies
      run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      shell: bash
