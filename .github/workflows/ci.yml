name: CI

on:
  pull_request:
    paths:
      - "**.rs"
      - "**Cargo.toml"
      - "**Cargo.lock"
  push:
    paths:
      - "**.rs"
      - "**Cargo.toml"
      - "**Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    strategy:
      matrix:
        toolchain: ["1.92", stable, nightly]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
        with:
          tool: nextest
      - name: Test
        # A D-Bus session bus is required: without one, every D-Bus-dependent
        # test in this repository silently returns early and reports success.
        run: dbus-run-session -- cargo nextest run --workspace --locked

  matrix-distro:
    strategy:
      fail-fast: false
      matrix:
        distro:
          - fedora:latest
          - archlinux:latest
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - name: Install dependencies (Fedora)
        if: contains(matrix.distro, 'fedora')
        run: |
          dnf install -y gcc gtk4 gtk4-devel git rust cargo dbus-daemon gdk-pixbuf2 gdk-pixbuf2-modules-extra glycin-thumbnailer
      - name: Install dependencies (Arch Linux)
        if: contains(matrix.distro, 'archlinux')
        run: |
          pacman -Syu --noconfirm base-devel gtk4 git rust cargo dbus gdk-pixbuf2
      - name: Build
        run: cargo build --locked
      - name: Debug thumbnailer registry (Fedora)
        if: contains(matrix.distro, 'fedora')
        run: |
          echo "--- /usr/share/thumbnailers ---"
          ls -la /usr/share/thumbnailers 2>&1 || echo "(missing)"
          echo "--- glycin-thumbnailer ---"
          command -v glycin-thumbnailer 2>&1 || echo "(not in PATH)"
          echo "--- gdk-pixbuf-thumbnailer ---"
          command -v gdk-pixbuf-thumbnailer 2>&1 || echo "(not in PATH)"
          echo "--- XDG_DATA_DIRS=${XDG_DATA_DIRS:-<unset>} ---"
      - name: Test
        # See the comment in the `test` job above: without a session bus the
        # D-Bus tests skip themselves and pass without asserting anything.
        run: dbus-run-session -- cargo test --locked
