name: CI

on:
  pull_request:
    paths:
      - '**.rs'
      - '**Cargo.toml'
      - '**Cargo.lock'
      # This file lists itself, unlike `lint.yml`: the jobs here run in
      # containers and against a toolchain this repository chooses, so a change
      # to what installs that toolchain is itself worth running.
      - '.github/workflows/ci.yml'
  push:
    paths:
      - '**.rs'
      - '**Cargo.toml'
      - '**Cargo.lock'
      - '.github/workflows/ci.yml'
  # The `paths` filters above mean that a change touching none of them runs
  # nothing at all. Dispatch runs the jobs whatever the filter says, and is
  # also how to re-run something a newer push cancelled.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# One group per ref, so a newer push to a branch cancels the run it supersedes
# instead of both running to completion. The prefix is what keeps this from
# cancelling `lint.yml` or `packaging.yml` outright.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Scoped to this job on purpose: this job installs sccache via
    # `.github/actions/setup-rust`. Setting RUSTC_WRAPPER workflow-wide would
    # make the `matrix-distro` containers below fail, because sccache is
    # neither installed nor on PATH there.
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.92", stable, nightly]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
        with:
          tool: nextest
      - name: Test
        # A D-Bus session bus is required: without one, every D-Bus-dependent
        # test in this repository silently returns early and reports success.
        run: dbus-run-session -- cargo nextest run --workspace --locked

  matrix-distro:
    strategy:
      fail-fast: false
      matrix:
        distro:
          - fedora:latest
          - archlinux:latest
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.distro }}
    # No sccache env here on purpose, see the note on the `test` job above.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies (Fedora)
        if: contains(matrix.distro, 'fedora')
        run: |
          dnf install -y gcc gtk4 gtk4-devel git rust cargo dbus-daemon gdk-pixbuf2 gdk-pixbuf2-modules-extra glycin-thumbnailer
      - name: Install dependencies (Arch Linux)
        if: contains(matrix.distro, 'archlinux')
        run: |
          pacman -Syu --noconfirm base-devel gtk4 git rust cargo dbus gdk-pixbuf2
      - name: Build
        run: cargo build --locked
      - name: Test
        # See the comment in the `test` job above: without a session bus the
        # D-Bus tests skip themselves and pass without asserting anything.
        run: dbus-run-session -- cargo test --locked
