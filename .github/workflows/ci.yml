name: CI

on:
  pull_request:
    paths:
      - '**.rs'
      - '**Cargo.toml'
      - '**Cargo.lock'
      - '.github/workflows/ci.yml'
  push:
    paths:
      - '**.rs'
      - '**Cargo.toml'
      - '**Cargo.lock'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    # Scoped to this job on purpose: this job installs sccache via
    # `.github/actions/setup-rust`. Setting RUSTC_WRAPPER workflow-wide would
    # make the `matrix-distro` containers below fail, because sccache is
    # neither installed nor on PATH there.
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.92", stable, nightly]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
        with:
          tool: nextest
      - name: Test
        # Tests are run within a dbus session, without one, every D-Bus-dependent
        # silently reports success (skips)  
        run: dbus-run-session -- cargo nextest run --workspace --locked

  matrix-distro:
    name: test (${{ matrix.distro }})
    strategy:
      fail-fast: false
      matrix:
        distro:
          - fedora:latest
          - archlinux:latest
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.distro }}
    # No sccache env here on purpose, see the note on the `test` job above.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies (Fedora)
        if: contains(matrix.distro, 'fedora')
        run: |
          dnf install -y gcc gtk4 gtk4-devel git rust cargo dbus-daemon gdk-pixbuf2 gdk-pixbuf2-modules-extra glycin-thumbnailer
      - name: Install dependencies (Arch Linux)
        if: contains(matrix.distro, 'archlinux')
        run: |
          pacman -Syu --noconfirm base-devel gtk4 git rust cargo dbus gdk-pixbuf2
      - name: Build
        run: cargo build --locked
      - name: Test
        run: dbus-run-session -- cargo test --locked

  freebsd:
    name: test (freebsd:15)
    runs-on: ubuntu-latest
    # GitHub-hosted runners only provide Linux, macOS and Windows images. A
    # container will not work either: Docker shares the Linux kernel, so it
    # cannot run FreeBSD binaries. vmactions boots a real FreeBSD VM with QEMU
    # and syncs the checkout into it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test in FreeBSD
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        with:
          # The action resolves a leading release component to the newest
          # matching release (currently 15.1); "latest" is not a valid value.
          release: "15"
          prepare: |
            set -eu
            pkg install -y pkgconf gtk4 gdk-pixbuf2 dbus rust
          run: |
            set -eu

            # The Print portal is linux only, so edit it out, else test
            # portal_file_matches_exported_interfaces fails
            sed -i '' 's|org\.freedesktop\.impl\.portal\.Print;||' data/gtk4.portal

            cargo build --locked

            dbus-run-session -- cargo test --locked
