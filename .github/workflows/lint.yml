name: Lint

on:
  pull_request:
    paths:
      - '**.rs'
      - '**Cargo.toml'
  push:
    paths:
      - '**.rs'
      - '**Cargo.toml'
      - '**Cargo.lock'
  # As in `ci.yml`: the path filters leave changes that touch none of them
  # unchecked. Dispatch runs the jobs whatever the filter says, and is also how
  # to re-run something a newer push cancelled.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          components: rustfmt
      - run: cargo +nightly fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --locked --workspace --tests

  rustdoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
      - run: cargo doc --no-deps --document-private-items
