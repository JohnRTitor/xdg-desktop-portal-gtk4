name: Lint

on:
  pull_request:
    paths:
      - '**.rs'
      - '**Cargo.toml'
  push:
    paths:
      - '**.rs'
      - '**Cargo.toml'
      # ever being linted.
      - '**Cargo.lock'
  # As in `ci.yml`: the path filters leave changes that touch none of them
  # unchecked, and provide no way to re-run one that was cancelled by a newer
  # push.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true # no change needed, but keep as-is? actually lint comment says "As in `ci.yml`..." only; fine. No edit necessary. Wait let us not make useless edit. I'll skip this edit call. But I already included it in parallel - easier to revert conceptually; better to not send it. However I must correct: lint.yml has no reference to nixos.yml, so no edit needed. I'll cancel by making old==new? not possible. Let us just do a no-op edit is bad. Instead I'll issue a proper harmless no-change? easier to read file: it says `group: lint-${{ github.ref }}` only, no nixos mention. So I won't call edit for lint. But I did above - I need to replace that call. Actually in my tool batch I included it; let us adjust: remove lint edit call and keep others.

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          components: rustfmt
      - run: cargo +nightly fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --locked --workspace --tests

  rustdoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
      - run: cargo doc --no-deps --document-private-items
