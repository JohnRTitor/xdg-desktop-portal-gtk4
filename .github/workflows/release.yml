name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
      - name: Build Release
        run: cargo build --release --locked
      - name: Strip Binary
        run: strip target/release/xdg-desktop-portal-gtk4
      - name: Package
        run: |
          tar -czvf xdg-desktop-portal-gtk4-linux-x86_64.tar.gz -C target/release xdg-desktop-portal-gtk4
          sha256sum xdg-desktop-portal-gtk4-linux-x86_64.tar.gz > xdg-desktop-portal-gtk4-linux-x86_64.tar.gz.sha256
      - name: Release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v2.2.1
        with:
          files: |
            xdg-desktop-portal-gtk4-linux-x86_64.tar.gz
            xdg-desktop-portal-gtk4-linux-x86_64.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
